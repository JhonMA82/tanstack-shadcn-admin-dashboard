schemaVersion: 1

project:
  template: studio-admin
  # Upstream baseline this fork was curated from (not this fork's version).
  upstreamVersion: 2.2.0
  # This factory's own release version; mirrors package.json version.
  factoryVersion: 0.3.0
  # Generated projects start at 0.1.0 with sourceVersion/sourceCommit recorded
  # in .boilerplate.json and rendered into PROJECT.md (see templates/project).
  framework: tanstack-start
  router: tanstack-router
  language: typescript
  packageManager: npm
  scriptRuntime: bun
  formatting: biome
  styling: tailwind-css-v4
  componentLibrary: shadcn-ui
  componentStyle: base-nova
  serverComponentsByDefault: false
  ssrFirst: true

paths:
  routes: src/routes
  dashboardRoutes: src/routes/(main)/dashboard
  routePrivateComponents: src/routes/(main)/dashboard/<feature>/-components
  sharedDashboardComponents: src/routes/(main)/dashboard/-components
  sharedApplicationComponents: src/components
  uiPrimitives: src/components/ui
  calendarPrimitives: src/components/calendar
  hooks: src/hooks
  utilities: src/lib
  navigation: src/navigation/sidebar/sidebar-items.ts
  server: src/server
  stores: src/stores
  themePresets: src/styles/presets
  generatorTemplates: templates
  repositoryScripts: scripts
  generatedContext: docs/ai/generated-context.md

protectedPaths:
  - src/components/ui/**
  - src/components/calendar/**

excludedReferences:
  - src/routes/(main)/dashboard/(legacy)/**

commands:
  generateProject: npm run generate:project --
  generateFeature: npm run generate:feature --
  generateCrud: npm run generate:crud --
  generateDashboard: npm run generate:dashboard --
  generateContext: npm run ai:context
  checkContext: npm run ai:context:check
  validateArchitecture: npm run validate:architecture
  validateNavigation: npm run validate:navigation
  validate: npm run validate

tooling:
  packageManager: npm
  scriptRuntime: bun

scaffolding:
  # Machine-readable contract for the generator CLIs (source of truth is the
  # scripts/create-*.ts implementations). force/noContext are maintenance-only:
  # agents should prefer the documented defaults and only pass them for
  # intentional replacement or faster batch scaffolding.
  feature:
    command: npm run generate:feature --
    usage: npm run generate:feature -- <kebab-name> [options]
    arguments:
      name:
        required: true
        format: kebab-case
        cli: positional <kebab-name>
      description:
        required: false
        type: string
        cli: --description <text>
      nav:
        required: false
        type: boolean
        default: false
        cli: --nav
      navGroup:
        required: false
        default: Pages
        cli: --nav-group <text>
      navIcon:
        required: false
        default: SquareArrowUpRight
        cli: --nav-icon <LucideExport>
      navTitle:
        required: false
        cli: --nav-title <text>
      force:
        required: false
        type: boolean
        cli: --force
        scope: maintenance-only
      noContext:
        required: false
        type: boolean
        cli: --no-context
        scope: maintenance-only
  dashboard:
    command: npm run generate:dashboard --
    usage: npm run generate:dashboard -- <kebab-name> [options]
    arguments:
      name:
        required: true
        format: kebab-case
        cli: positional <kebab-name>
      description:
        required: false
        type: string
        cli: --description <text>
      navigation:
        required: false
        type: boolean
        default: true
        cli: --no-nav disables
      navIcon:
        required: false
        default: LayoutDashboard
        cli: --nav-icon <LucideExport>
      navTitle:
        required: false
        cli: --nav-title <text>
      force:
        required: false
        type: boolean
        cli: --force
        scope: maintenance-only
      noContext:
        required: false
        type: boolean
        cli: --no-context
        scope: maintenance-only
  crud:
    command: npm run generate:crud --
    usage: npm run generate:crud -- <plural-kebab-route> [options]
    arguments:
      plural:
        required: true
        format: kebab-case
        cli: positional <plural-kebab-route>
      singular:
        required: false
        format: kebab-case
        cli: --singular <kebab-name>
      description:
        required: false
        type: string
        cli: --description <text>
      navigation:
        required: false
        type: boolean
        default: true
        cli: --no-nav disables
      navGroup:
        required: false
        default: Pages
        cli: --nav-group <text>
      navIcon:
        required: false
        default: Users
        cli: --nav-icon <LucideExport>
      navTitle:
        required: false
        cli: --nav-title <text>
      force:
        required: false
        type: boolean
        cli: --force
        scope: maintenance-only
      noContext:
        required: false
        type: boolean
        cli: --no-context
        scope: maintenance-only

invariants:
  - route.tsx remains SSR-safe by default
  - no "use client" directives anywhere
  - browser APIs run only in effects, guarded client code, <ClientOnly>, or createClientOnlyFn
  - server behavior uses createServerFn with input validation
  - interactive behavior is isolated in focused components
  - route-private code stays with its owning route
  - shared components require concrete multiple consumers
  - feature code does not modify protected primitives
  - feature code does not import another feature's private internals
  - server and utility layers do not import route modules
  - semantic theme tokens are preferred
  - legacy routes are not references for new work
  - generated AI context remains current

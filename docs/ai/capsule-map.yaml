schemaVersion: 1

source:
  boilerplate: tanstack-shadcn-admin-dashboard
  version: 0.3.1
  capsulesDir: docs/patterns/canonical

# Resolve at most 2 capsules per task via trigger keywords below.
# Capsules are distilled references; load source only for line-level detail.
capsules:
  - id: default-dashboard
    capsule: docs/patterns/canonical/default.md
    triggers:
      - overview
      - executive
      - resumen
      - general
      - baseline shell
      - neutral dashboard
    generator: npm run generate:dashboard -- <name>

  - id: finance-dashboard
    capsule: docs/patterns/canonical/finance.md
    triggers:
      - finance
      - finanzas
      - money
      - balances
      - transactions
      - wallet
      - budget
      - presupuesto

  - id: infrastructure-dashboard
    capsule: docs/patterns/canonical/infrastructure.md
    triggers:
      - infrastructure
      - infraestructura
      - ops
      - deployments
      - despliegues
      - environments
      - entornos
      - regions
      - status page

  - id: crm-dashboard
    capsule: docs/patterns/canonical/crm.md
    triggers:
      - crm
      - pipeline
      - funnel
      - embudo
      - leads
      - opportunities
      - oportunidades
      - sales
      - ventas

  - id: analytics-dashboard
